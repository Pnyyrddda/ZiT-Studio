<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Каталог — ZiT Studio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="catalog-page">
<header class="site-header">
  <a class="logo" href="index.html">ZiT Studio</a>
  <nav class="nav">
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="brands.html">Бренды</a>
    <a href="cart.html">Корзина <span id="cart-count">0</span></a>
  </nav>
</header>

<main class="catalog-main">
  <h1 id="catalog-title">Каталог</h1>
  <div class="catalog-grid">
    <form id="catalog-filters" class="filters">
      <h2>Фильтры</h2>
      <label>Бренд
        <select id="brandFilter" name="brand"><option value="">Все</option></select>
      </label>
      <label>Категория
        <select id="categoryFilter" name="category"><option value="">Все</option></select>
      </label>
      <label>Поиск
        <input id="textSearch" name="query" type="search" placeholder="По названию">
      </label>
      <div class="price-filter">
        <label>Цена от ($)
          <input id="minPrice" name="minPrice" type="number" min="0" step="0.01">
        </label>
        <label>Цена до ($)
          <input id="maxPrice" name="maxPrice" type="number" min="0" step="0.01">
        </label>
      </div>
      <button type="button" data-reset-filters>Сбросить фильтры</button>
    </form>

    <section class="products">
      <div id="productGrid" class="product-grid"></div>
    </section>
  </div>
</main>

<script src="js/catalog.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-view.js"></script>
<script src="js/catalog-filters.js"></script>
<script src="js/app.js"></script>
</body>
</html>
