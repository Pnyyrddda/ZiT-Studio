<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар — ZiT Studio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/purchase.css">
</head>
<body class="purchase-page">
    <header class="purchase-header">
        <a class="logo" href="index.html">ZiT Studio</a>
        <nav aria-label="Магазин">
            <a href="catalog.html">Каталог</a>
            <a href="cart.html">Корзина (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="purchase-main">
        <a class="back-link" href="catalog.html">← В каталог</a>
        <article id="product-details" hidden>
            <div class="gallery">
                <div class="gallery-main">
                    <img id="product-image" alt="" hidden>
                    <p id="photo-unavailable" hidden>Фото недоступно</p>
                </div>
                <div id="product-photos" class="gallery-thumbnails" aria-label="Фотографии товара" hidden></div>
            </div>

            <div class="product-info">
                <p id="product-brand" class="product-brand"></p>
                <h1 id="product-name"></h1>
                <p id="product-price" class="product-price"></p>
                <p id="product-description" class="product-description" hidden></p>

                <form id="product-form">
                    <fieldset id="product-sizes" hidden>
                        <legend id="size-legend">Размер</legend>
                        <div id="size-options" class="size-options"></div>
                    </fieldset>
                    <button class="btn purchase-button" type="submit">В корзину</button>
                </form>
                <p id="product-status" role="status"></p>
            </div>
        </article>
        <section id="product-missing" hidden>
            <h1 id="product-missing-title"></h1>
        </section>
    </main>

    <script src="js/catalog.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-view.js"></script>
    <script src="js/product.js"></script>
</body>
</html>
